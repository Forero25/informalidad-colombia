name: Explorar catálogo del DANE
on:
  workflow_dispatch:
    inputs:
      id:
        description: "id del estudio en el catálogo (vacío: buscar)"
        required: false
jobs:
  explorar:
    runs-on: ubuntu-latest
    steps:
      - name: Buscar la GEIH en el catálogo de microdatos
        if: ${{ inputs.id == '' }}
        run: |
          curl -sSL -A "informalidad-colombia (github.com/Forero25)" "https://microdatos.dane.gov.co/index.php/api/catalog/search?sk=Gran%20Encuesta%20Integrada%20de%20Hogares&ps=50" -o busca.json -w "%{http_code}\n"
          python3 -c "
          import json; d=json.load(open('busca.json'))
          r=d.get('result',d); rows=r.get('rows',r) if isinstance(r,dict) else r
          for x in rows: print(x.get('id'), x.get('idno'), x.get('title'), x.get('year_start'), x.get('year_end'))
          " ; head -c 3000 busca.json; echo
          curl -sSL -A "informalidad-colombia (github.com/Forero25)" "https://microdatos.dane.gov.co/index.php/catalog/central/search?sk=GEIH+2025" -o busca.html -w "%{http_code}\n"
          python3 -c "
          import re; h=open('busca.html',encoding='utf-8',errors='ignore').read()
          for m in sorted(set(re.findall(r'catalog/(\\d+)[^>]*>([^<]{5,120})<',h)))[:80]: print(m)
          "
      - name: Recursos del estudio
        if: ${{ inputs.id != '' }}
        run: |
          curl -sSL -A "informalidad-colombia (github.com/Forero25)" "https://microdatos.dane.gov.co/index.php/catalog/${{ inputs.id }}/get-microdata" -o micro.html -w "%{http_code}\n"
          python3 -c "
          import re; h=open('micro.html',encoding='utf-8',errors='ignore').read()
          print(len(h)); print(re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',h))[:3000])
          for m in sorted(set(re.findall(r'href=\"([^\"]*download[^\"]*)\"',h)))[:60]: print(m)
          "
